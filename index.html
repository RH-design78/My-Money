<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#2b5a8a">
<title>My Money</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<style id="appstyle">
:root{--bg:#f6f4ef;--card:#fff;--ink:#1d2321;--muted:#5f6763;--line:#e3e0d8;--in:#1f7a4d;--out:#b3402f;--accent:#2b5a8a;--soft:#eef3f8;--res:#1f6fb2}
html{color-scheme:light}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
main{max-width:720px;margin:0 auto;padding:20px 16px 60px}
h1{font-size:26px;margin:4px 0 2px}
.sub{color:var(--muted);margin:0 0 18px;font-size:15px}
.summary{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:12px}
.tile{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px}
.tile .lbl{font-size:14px;color:var(--muted)}
.tile .num{font-size:24px;font-weight:700;margin-top:4px;font-variant-numeric:tabular-nums}
.in{color:var(--in)}.out{color:var(--out)}.res{color:var(--res)}
.note{background:var(--soft);border-radius:12px;padding:12px 14px;margin-bottom:22px;font-size:15px}
section{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:6px 14px 14px;margin-bottom:18px}
.head{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:10px 0}
.head h2{font-size:20px;margin:0}.head button{white-space:nowrap;flex:none}
.explain{color:var(--muted);font-size:14px;margin:-4px 0 6px}
.row{display:flex;align-items:center;gap:10px;padding:12px 0;border-top:1px solid var(--line)}
.row input[type=checkbox]{width:24px;height:24px;flex:none;accent-color:var(--in)}
.name{flex:1;min-width:0}
.name b{display:block;font-weight:600;overflow-wrap:anywhere}
.name small{color:var(--muted);font-size:14px}
.amt{font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}
.paid .name b,.paid .amt{text-decoration:line-through;color:var(--muted)}
button{font:inherit;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--ink);padding:8px 12px;cursor:pointer}
button.main{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}
button.edit{padding:6px 10px;font-size:15px}
button.del{color:var(--out)}
button.wide{width:100%;padding:12px}
.total{display:flex;justify-content:space-between;padding-top:12px;border-top:2px solid var(--line);font-weight:700}
.plan{display:inline-block;margin-top:4px;background:#e8f0f8;color:#1f3f63;border-radius:8px;padding:2px 8px;font-size:14px}.plan.done{background:#e3f3ea;color:#1f7a4d}.name .plan b{display:inline;font-weight:700}
.grp{display:flex;justify-content:space-between;font-size:16px;margin:16px 0 0;padding-bottom:6px;color:var(--accent)}.grp span{color:var(--muted);font-weight:400;font-size:14px}
.owe{display:block;color:var(--out);font-weight:700;font-size:15px;margin-top:2px}.owetot{border-top:1px solid var(--line);margin-top:10px}
.empty{color:var(--muted);padding:12px 0;border-top:1px solid var(--line)}
.tools{display:grid;gap:10px;margin-top:8px}
dialog{border:none;border-radius:16px;padding:0;width:min(440px,94vw);background:var(--card);color:var(--ink)}
dialog::backdrop{background:rgba(0,0,0,.45)}
form{padding:20px}
form h3{margin:0 0 14px;font-size:20px}
form p{margin:0 0 6px;font-size:15px;color:var(--muted)}
label{display:block;font-size:15px;color:var(--muted);margin:12px 0 4px}
input[type=text],input[type=number],input[type=password],select{width:100%;font:inherit;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink)}
.btns{display:flex;gap:8px;justify-content:space-between;margin-top:20px;flex-wrap:wrap}
.btns .right{display:flex;gap:8px;margin-left:auto}
.err{color:var(--out);font-weight:600;font-size:15px;margin-top:10px}
.lock{max-width:400px;margin:12vh auto 0;background:var(--card);border:1px solid var(--line);border-radius:20px;padding:26px 22px}
.lock h1{margin:0 0 6px}.lock p{color:var(--muted);margin:0 0 6px;font-size:16px}
.lock button{width:100%;margin-top:16px;padding:12px}
#status{position:fixed;bottom:14px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:8px 16px;border-radius:20px;font-size:15px;opacity:0;transition:opacity .3s;pointer-events:none}
#status.show{opacity:1}
@media (max-width:520px){.summary{grid-template-columns:1fr}.tile .num{font-size:26px}}
</style>
</head>

  h+='<h3 class="grp">'+g[1]+' <span>'+money(sum(gb))+' a month</span></h3>';
  gb.forEach(function(x){var p=state.paid.indexOf(x.id)>=0;h+='<div class="row'+(p?' paid':'')+'"><input type="checkbox" aria-label="Gone out this month" data-tick="'+x.id+'"'+(p?' checked':'')+'><div class="name"><b>'+esc(x.name)+'</b><small>'+sub(x)+'</small>'+planLine(x)+'</div><span class="amt out">'+money(+x.amount)+(x.freq==='yearly'?'/yr':'')+'</span><button class="edit" data-edit="bills:'+x.id+'">Change</button></div>';});
 });
 h+='<div class="total"><span>Total a month</span><span class="out">'+money(out)+'</span></div></section>';
 var avail=0,unknown=0,owedT=0;
 h+='<section><div class="head"><h2>Reserve &amp; emergency money</h2><button class="main" data-add="reserve">+ Add</button></div>';
 h+='<p class="explain">Only for emergencies. This is credit, so it has to be paid back. It isn\'t counted in your totals above.</p>';
 if(!state.reserve.length)h+='<div class="empty">Nothing added yet.</div>';
 state.reserve.forEach(function(x){
  var av=Math.max(0,(+x.limit||0)-(+x.owed||0));avail+=av;owedT+=(+x.owed||0);
  var s='Limit '+money(+x.limit||0);if(x.note)s+=' · '+esc(x.note);
  h+='<div class="row"><div class="name"><b>'+esc(x.name)+'</b><small>'+s+'</small>'+(+x.owed>0?'<span class="owe">You owe '+money(+x.owed)+'</span>':'')+'</div><span class="amt res">'+money(av)+'</span><button class="edit" data-edit="reserve:'+x.id+'">Change</button></div>';
 });
 h+='<div class="total"><span>Available to use</span><span class="res">'+money(avail)+'</span></div>'+(owedT>0?'<div class="total owetot"><span>You owe in total</span><span class="out">'+money(owedT)+'</span></div>':'')+'</section>';
 h+='<div class="tools">';
 if(!LOCKED)h+='<button class="wide" id="mklock">🔒 Make a locked copy for GitHub</button>';
 if(LOCKED)h+='<button class="wide" id="logout">🔒 Lock this app on this device</button>';
 h+='</div>';
 app.innerHTML=h;
 var mk=document.getElementById('mklock');if(mk)mk.onclick=openLock;
 var lo=document.getElementById('logout');if(lo)lo.onclick=function(){try{localStorage.removeItem('mm-key');}catch(e){}location.reload();};
}
function show(id,on){document.getElementById(id).style.display=on?'block':'none';}
function open(list,id){
 var x=id?state[list].filter(function(i){return i.id===id;})[0]:null;
 editing={list:list,id:id};
 var what=list==='income'?'money coming in':list==='bills'?'a bill':'emergency money';
 document.getElementById('ftitle').textContent=(x?'Change ':'Add ')+what;
 document.getElementById('fname').value=x?x.name:'';
 document.getElementById('fnote').value=x&&x.note?x.note:'';
 show('fmoney',list!=='reserve');show('freserve',list==='reserve');show('fgroupwrap',list==='bills');show('fendwrap',list==='bills');
 if(list==='reserve'){document.getElementById('flimit').value=x?x.limit:'';document.getElementById('fowed').value=x&&+x.owed>0?x.owed:'';}
 else{document.getElementById('famt').value=x?x.amount:'';document.getElementById('ffreq').value=x?x.freq:'monthly';document.getElementById('fday').value=x?x.day:'';document.getElementById('fgroup').value=x&&x.group?x.group:'other';document.getElementById('fend').value=x&&x.endMonth?x.endMonth:'';}
 document.getElementById('flimit').required=(list==='reserve');
 document.getElementById('fdel').style.visibility=x?'visible':'hidden';
 dlg.showModal();
}
app.addEventListener('click',function(e){
 var t=e.target;
 if(t.dataset.add)open(t.dataset.add,null);
 if(t.dataset.edit){var p=t.dataset.edit.split(':');open(p[0],p[1]);}
});
app.addEventListener('change',function(e){
 var id=e.target.dataset.tick;if(!id)return;
 var i=state.paid.indexOf(id);if(e.target.checked&&i<0)state.paid.push(id);if(!e.target.checked&&i>=0)state.paid.splice(i,1);
 render();save();
});
function r2(v){return Math.round(parseFloat(v)*100)/100;}
document.getElementById('frm').addEventListener('submit',function(e){
 e.preventDefault();
 var L=editing.list,item={name:document.getElementById('fname').value.trim(),note:document.getElementById('fnote').value.trim()};
 if(!item.name)return;
 if(L==='reserve'){item.limit=r2(document.getElementById('flimit').value)||0;if(document.getElementById('flimit').value==='')return;var ow=document.getElementById('fowed').value;item.owed=ow===''?0:r2(ow);item.available=r2(Math.max(0,item.limit-item.owed));}
 else{item.amount=r2(document.getElementById('famt').value);if(isNaN(item.amount))return;item.freq=document.getElementById('ffreq').value;item.day=document.getElementById('fday').value;if(L==='bills'){item.group=document.getElementById('fgroup').value;var em=document.getElementById('fend').value;if(em)item.endMonth=em;}}
 var list=state[L];
 if(editing.id){list.forEach(function(x,i){if(x.id===editing.id){item.id=x.id;list[i]=item;}});}
 else{item.id=L.charAt(0)+Date.now();list.push(item);}
 dlg.close();render();save();
});
var delArmed=null;
document.getElementById('fdel').addEventListener('click',function(){
 var b=this;if(delArmed!==editing.id){delArmed=editing.id;b.textContent='Tap again to delete';return;}
 state[editing.list]=state[editing.list].filter(function(i){return i.id!==editing.id;});
 state.paid=state.paid.filter(function(i){return i!==editing.id;});
 dlg.close();render();save();
});
dlg.addEventListener('close',function(){delArmed=null;document.getElementById('fdel').textContent='Delete';});
document.getElementById('fcancel').addEventListener('click',function(){dlg.close();});
function flash(msg){var s=document.getElementById('status');s.textContent=msg;s.classList.add('show');setTimeout(function(){s.classList.remove('show');},2000);}
function buildDoc(dataText,lockedText){
 var parts=['<!DOCTYPE html>\n<html lang="en-GB">\n<head>\n<meta charset="utf-8">\n<meta name="viewport" content="width=device-width, initial-scale=1">\n<meta name="theme-color" content="#2b5a8a">\n<title>My Money</title>\n<link rel="manifest" href="manifest.webmanifest">\n<link rel="icon" href="icons/icon-192.png">\n<link rel="apple-touch-icon" href="icons/icon-192.png">\n',
 document.getElementById('appstyle').outerHTML,'\n</head>\n<body>\n<script id="data" type="application/json">',dataText,'</scr'+'ipt>\n<script id="locked" type="application/json">',lockedText,'</scr'+'ipt>\n<main id="app"></main>\n',
 dlg.outerHTML.replace(/ open=""/,''),'\n',lockdlg.outerHTML.replace(/ open=""/,''),'\n<div id="status"></div>\n<script id="appcode">',document.getElementById('appcode').textContent,'</scr'+'ipt>\n</body>\n</html>\n'];
 return parts.join('');
}
function jsonText(o){return JSON.stringify(o).replace(/</g,'\\u003c');}
function save(){
 state.savedAt=Date.now();
 clearTimeout(saveTimer);
 saveTimer=setTimeout(function(){
  if(LOCKED){
   seal(KEY,state).then(function(b){try{localStorage.setItem('mm-data',JSON.stringify(b));flash('Saved on this device');}catch(e){flash('Could not save');}});
   return;
  }
  try{localStorage.setItem('myMoney',JSON.stringify(state));}catch(e){}
  if(!artifact){flash('Saved on this device');return;}
  artifact.publish(buildDoc(jsonText(state),'')).then(function(){flash('Saved');},function(err){var c=err&&(err.code||err.message||'');if(/conflict/.test(c))flash('Updated elsewhere, reloading');else flash('Saved on this device only');});
 },800);
}
// ---------- make locked copy ----------
function openLock(){document.getElementById('lp1').value='';document.getElementById('lp2').value='';document.getElementById('lockerr').hidden=true;lockdlg.showModal();}
document.getElementById('lockcancel').onclick=function(){lockdlg.close();};
document.getElementById('lockfrm').addEventListener('submit',function(e){
 e.preventDefault();
 var p1=document.getElementById('lp1').value,p2=document.getElementById('lp2').value,er=document.getElementById('lockerr'),go=document.getElementById('lockgo');
 function fail(m){er.textContent=m;er.hidden=false;go.disabled=false;go.textContent='Make the file';}
 if(p1.length<4)return fail('Please use a longer password.');
 if(p1!==p2)return fail('The two passwords are different. Try again.');
 if(!window.crypto||!crypto.subtle)return fail('This browser can\'t lock files. Please use Chrome.');
 go.disabled=true;go.textContent='Locking…';
 var copy=JSON.parse(JSON.stringify(state));copy.savedAt=Date.now();
 derive(p1).then(function(k){return seal(k,copy);}).then(function(blob){
  var html=buildDoc('null',JSON.stringify(blob));
  var p=downloads?downloads.save({filename:'index.html',data:html}):new Promise(function(res){var a=document.createElement('a');a.href=URL.createObjectURL(new Blob([html],{type:'text/html'}));a.download='index.html';document.body.appendChild(a);a.click();a.remove();res();});
  return p.then(function(){lockdlg.close();go.disabled=false;go.textContent='Make the file';flash('Locked file made');},function(err){fail(err&&err.code==='declined'?'The download was cancelled.':'Couldn\'t download the file here.');});
 }).catch(function(){fail('Something went wrong. Try again.');});
});
// ---------- start ----------
function startNormal(){
 state=JSON.parse(document.getElementById('data').textContent);
 try{var local=localStorage.getItem('myMoney');if(local&&!window.claude){var l=JSON.parse(local);if(l&&l.bills&&(l.savedAt||0)>=(state.savedAt||0))state=l;}}catch(e){}
 fixMonth();render();
 if(window.claude&&window.claude.use){
  window.claude.use('artifact').then(function(a){artifact=a;}).catch(function(){});
  window.claude.use('downloads').then(function(d){downloads=d;}).catch(function(){});
 }
}
function unlocked(key,data){
 KEY=key;state=data;
 try{var s=localStorage.getItem('mm-data');if(s){unseal(key,JSON.parse(s)).then(function(l){if(l&&l.bills&&(l.savedAt||0)>(state.savedAt||0)){state=l;fixMonth();render();}}).catch(function(){});}}catch(e){}
 fixMonth();render();
}
function showLock(msg){
 app.innerHTML='<form class="lock" id="unlock"><h1>My Money</h1><p>Enter your password. This device will remember it.</p>'+(msg?'<div class="err" role="alert">'+esc(msg)+'</div>':'')+'<label for="pw">Password</label><input id="pw" type="password" autocomplete="current-password" required autofocus><button class="main" id="ugo" type="submit">Open</button></form>';
 document.getElementById('unlock').addEventListener('submit',function(e){
  e.preventDefault();var b=document.getElementById('ugo');b.disabled=true;b.textContent='Opening…';
  var k;derive(document.getElementById('pw').value).then(function(key){k=key;return unseal(key,lockedBlob);}).then(function(d){
   crypto.subtle.exportKey('raw',k).then(function(raw){try{localStorage.setItem('mm-key',b64(raw));}catch(_){}});
   unlocked(k,d);
  }).catch(function(){showLock('That password is not right. Try again.');});
 });
}
function startLocked(){
 try{if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(function(){});}catch(e){}
 if(!window.crypto||!crypto.subtle){app.innerHTML='<div class="lock"><h1>My Money</h1><p>This browser can\'t open the locked app. Please open it in Chrome.</p></div>';return;}
 var saved=null;try{saved=localStorage.getItem('mm-key');}catch(e){}
 if(!saved)return showLock();
 var k;crypto.subtle.importKey('raw',unb64(saved),{name:'AES-GCM'},true,['encrypt','decrypt']).then(function(key){k=key;return unseal(key,lockedBlob);}).then(function(d){unlocked(k,d);}).catch(function(){try{localStorage.removeItem('mm-key');}catch(_){}showLock();});
}
if(LOCKED)startLocked();else startNormal();
})();
